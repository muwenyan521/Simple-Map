plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
}

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = "${mod_id}-1.21.1-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // The FancyModLoader early window can time out on Windows while GLFW
            // is still starting, even though the normal Minecraft window would
            // initialize successfully a moment later. Disable only the dev-run
            // progress window; this property is not packaged into the mod jar.
            systemProperty 'fml.earlyprogresswindow', 'false'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

dependencies {
}

// src/test/java contains standalone architecture checks with main() methods,
// not JUnit/TestNG tests. Gradle 9 fails the built-in test task when test
// sources exist but no framework tests are discovered, so allow this
// intentional no-test suite while keeping the JavaExec checks below active.
tasks.named('test', Test) {
    // Added by newer Gradle releases; the checked-in 8.10.2 wrapper does not
    // expose it. Keep one build file valid on both sides of that API boundary.
    if (delegate.hasProperty('failOnNoDiscoveredTests')) {
        delegate.setProperty('failOnNoDiscoveredTests', false)
    }
}

jar {
    destinationDirectory = file("../mods")
}

// Dependency-light state checks for the M2/M3 migration and M4 foundation.
tasks.register('m2m3CoreCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.M2M3CoreCheck'
}

// Alias used by checkpoints that also validate the M4 durable LOD graph.
tasks.register('m2m4CoreCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.M2M3CoreCheck'
}

// M4 region-centric hierarchy invariants: direct source seeding, 8x8 parent
// propagation, deferred-work durability and exact-eviction replacement.
tasks.register('m4RegionLodCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.M4RegionLodAuthorityCheck'
}

tasks.named('m2m4CoreCheck') {
    dependsOn tasks.named('m4RegionLodCheck')
}

// Integrated architecture invariants for M5 page tables, M6 minimap ring,
// M7/M8 cave archive/projection, M9 upload admission, M10 recovery and M11 boundaries.
tasks.register('architectureStackCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.ArchitectureStackCheck'
}

// Surface fullscreen/minimap demand uses primitive centre-out buffers.
tasks.register('viewportLoadPlannerCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.MapViewLoadPlannerCheck'
}

// Cave foreground stages must preserve one centre-out ordinal authority.
tasks.register('caveLoadHierarchyCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.cave.CaveLoadHierarchyCheck'
}

// Fullscreen cave pages may build ahead, but cache/exact publication must never
// jump over an unresolved page and form black islands inside loaded terrain.
tasks.register('caveContiguousPublicationCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.cave.CaveContiguousPublicationCheck'
}

// AUTO dimension topology must not let repeated End-island roofs become a
// persistent cave world, and each Layered cache key must own one immutable Top Y.
tasks.register('caveDimensionEvidenceCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.cave.CaveDimensionEvidenceCheck'
}

tasks.register('caveLayerBandCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.cave.CaveLayerBandCheck'
}

// Cave/Full Cave must use Xaero's enter-ground -> real-air -> first-floor
// transaction, and cache revisions must invalidate older projection semantics.
tasks.register('caveProjectionSemanticsCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.cave.CaveProjectionSemanticsCheck'
}

tasks.register('adaptiveDimensionLoadCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.cave.AdaptiveDimensionLoadPolicyCheck'
}

// Retained minimap invalidation must react to atlas pixel writes without
