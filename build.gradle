tasks.register('caveRegionImageCacheCheck', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.velorise.simplemap.client.cave.CaveRegionImageCacheCheck'
}
